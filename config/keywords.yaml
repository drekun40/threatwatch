# Threat keywords, grouped by category.
# Edit here or in the dashboard (Keywords tab) — the dashboard writes back to this file.
#
# weight:  how serious a hit in this category is (0–10).
#          Categories with weight 0 are "context" — they never trigger a hit on their own,
#          but they add to the score when they appear with a threat term.
# terms:   matched case-insensitively on word boundaries; simple plurals (s/es) match automatically.
#          Write "fight" and you also get "fights"; "gunshot" also gets "gunshots".

